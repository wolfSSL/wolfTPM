name: Publish wolfTPM CI image

# Publish v1.1 before merging workflows that consume it. Consumers use the
# canonical ghcr.io/wolfssl/wolftpm-ci package, including on forks. A fork of
# this publisher writes to its own namespace for image testing only.
# The canonical package must be public so fork PRs can pull it anonymously.
# Dependencies are installed only when baking this image; consumers have no
# package-manager fallback. Keep versioned tags rather than using :latest.

on:
  push:
    branches: [ 'master', 'main' ]
    paths:
      - '.github/docker/wolftpm-ci/**'
      - '.github/workflows/publish-ci-image.yml'
  workflow_dispatch: {}

concurrency:
  # Single global group: every run publishes to the shared version tag, so
  # serialize to avoid two runs racing to overwrite it.
  group: publish-ci-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    # Runs for any owner: the job only ever pushes to its own ghcr namespace
    # (GITHUB_TOKEN has packages:write to the owner running it), so forks can
    # publish their own wolftpm-ci image for testing.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1

      - name: Compute lowercase owner
        id: owner
        run: echo "lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .github/docker/wolftpm-ci
          file: .github/docker/wolftpm-ci/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          # ghcr image paths must be lowercase (the wolfSSL org has a capital S).
          tags: ghcr.io/${{ steps.owner.outputs.lc }}/wolftpm-ci:v1.1
          cache-from: type=registry,ref=ghcr.io/${{ steps.owner.outputs.lc }}/wolftpm-ci:v1.1
          cache-to: type=inline

      - name: Check baked tools
        env:
          CI_IMAGE: ghcr.io/${{ steps.owner.outputs.lc }}/wolftpm-ci:v1.1
        run: |
          docker run --rm "$CI_IMAGE" bash -euo pipefail -c '
            for tool in autoconf automake libtoolize cmake ninja pkg-config \
                gcc-11 gcc-12 gcc-13 g++-11 g++-12 g++-13 \
                clang-14 clang-15 clang-17 arm-none-eabi-gcc \
                rustc cargo mcs nunit-console tpm2_activatecredential \
                xxd semgrep pyspdxtools codespell m33mu; do
              command -v "$tool"
            done
            cargo clippy --version
            cargo fmt --version
            python3 -c "import spdx_tools"
            /opt/zephyr-python/bin/west --version
            test -x /opt/zephyr-sdk-0.16.1/x86_64-zephyr-elf/bin/x86_64-zephyr-elf-gcc
          '

      - name: Push verified image
        env:
          CI_IMAGE: ghcr.io/${{ steps.owner.outputs.lc }}/wolftpm-ci:v1.1
        run: docker push "$CI_IMAGE"

      - name: Verify anonymous access for fork PRs
        if: github.repository_owner == 'wolfssl'
        env:
          CI_IMAGE: ghcr.io/${{ steps.owner.outputs.lc }}/wolftpm-ci:v1.1
        run: |
          registry_config=$(mktemp -d)
          trap 'rm -rf "$registry_config"' EXIT
          if ! docker --config "$registry_config" manifest inspect "$CI_IMAGE" > /dev/null; then
            echo '::error::Make the wolftpm-ci package public in its GHCR package settings before merging the consumer workflows.'
            exit 1
          fi
