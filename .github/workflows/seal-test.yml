name: Seal Test Suite

on:
  push:
    branches: [ 'master', 'main', 'release/**' ]
    paths:
      - 'examples/seal/**'
      - 'examples/nvram/seal_nv.c'
      - 'examples/nvram/nvram.h'
      - 'src/tpm2_wrap.c'
      - 'src/fwtpm/**'
      - 'wolftpm/tpm2_wrap.h'
      - '.github/workflows/seal-test.yml'
      - '.github/docker/wolftpm-ci/**'
  pull_request:
    branches: [ '*' ]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'examples/seal/**'
      - 'examples/nvram/seal_nv.c'
      - 'examples/nvram/nvram.h'
      - 'src/tpm2_wrap.c'
      - 'src/fwtpm/**'
      - 'wolftpm/tpm2_wrap.h'
      - '.github/workflows/seal-test.yml'
      - '.github/docker/wolftpm-ci/**'
  repository_dispatch:
    types: [nightly-trigger]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  seal-test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/wolfssl/wolftpm-ci:v1.1
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout wolfTPM
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup wolfSSL
        uses: ./.github/actions/setup-wolfssl
        with:
          configure-flags: --enable-wolftpm --enable-pkcallbacks --enable-keygen
          cflags: -DWC_RSA_NO_PADDING

      - name: Build wolfTPM with fwTPM
        run: |
          ./autogen.sh
          ./configure --enable-fwtpm --enable-swtpm --enable-debug
          make -j"$(nproc)"

      - name: Run seal tests against fwtpm_server
        run: |
          rm -f fwtpm_nv.bin
          ./src/fwtpm/fwtpm_server > /tmp/seal_fwtpm.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true; rm -f fwtpm_nv.bin' EXIT
          for _ in $(seq 1 500); do
              ss -tln 2>/dev/null | grep -q ':2321 ' && break
              sleep 0.01
          done
          if ! ss -tln 2>/dev/null | grep -q ':2321 '; then
              echo "fwtpm_server failed to start"
              cat /tmp/seal_fwtpm.log
              exit 1
          fi

          bash examples/seal/seal_test.sh

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: seal-test-logs
          path: |
            seal_test.log
            /tmp/seal_fwtpm.log
          retention-days: 5
