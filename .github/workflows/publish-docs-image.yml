name: Publish documentation image

on:
  push:
    branches: [master]
    paths:
      - 'docker/docs/**'
      - '.github/workflows/publish-docs-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-wolftpm-docs-image
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'wolfSSL/wolfTPM'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select image tag
        id: image
        run: |
          image_sha=$(sha256sum docker/docs/Dockerfile docker/docs/requirements.txt | sha256sum | cut -c1-16)
          echo "tag=ghcr.io/wolfssl/wolftpm-docs:sha-$image_sha" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: docker/docs
          file: docker/docs/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.tag }}
