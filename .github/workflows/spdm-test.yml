name: SPDM Test

# Validates wolfSPDM end-to-end against the fwtpm SPDM responder on
# ubuntu-latest. Replaces hw-spdm-test.yml's self-hosted hardware runs;
# same protocol coverage (PSK + TCG) but no silicon required.

on:
  push:
    branches: [master]
    paths:
      - 'src/spdm/**'
      - 'lib/wolfSPDM'
      - '.gitmodules'
      - 'wolftpm/spdm/**'
      - 'src/fwtpm/**'
      - 'wolftpm/fwtpm/**'
      - 'examples/spdm/**'
      - 'src/tpm2_wrap.c'
      - 'src/tpm2_spdm.c'
      - 'src/tpm2.c'
      - 'configure.ac'
      - '.github/workflows/spdm-test.yml'
      - '.github/docker/wolftpm-ci/**'
      - 'scripts/ci/spdm.sh'
      - 'tests/unit_tests.c'
  pull_request:
    branches: [master]

permissions: read-all

jobs:
  # Build matrix: every supported SPDM configure permutation compiles cleanly;
  # the single-vendor entries also smoke-test unavailable-adapter rejection.
  # Catches missing `#ifdef WOLFTPM_SPDM_*` guards and include.am gating.
  build-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: spdm-base-only
            wolftpm_config: "--enable-spdm --disable-fwtpm --disable-tcg --disable-psk"
          - name: spdm-tcg-only
            wolftpm_config: "--enable-fwtpm --enable-spdm --enable-tcg --disable-psk"
          - name: spdm-both
            wolftpm_config: "--enable-fwtpm --enable-spdm --enable-tcg --enable-psk"
          - name: spdm-nuvoton
            wolftpm_config: "--enable-fwtpm --enable-spdm --enable-nuvoton"
          - name: spdm-nations
            wolftpm_config: "--enable-fwtpm --enable-spdm --enable-nations"
          - name: spdm-full-vendors
            wolftpm_config: "--enable-fwtpm --enable-spdm --enable-tcg --enable-psk --enable-nuvoton --enable-nations"
          - name: spdm-requester-only
            wolftpm_config: "--enable-spdm --enable-nuvoton --enable-nations"
          - name: spdm-debug-on
            wolftpm_config: "--enable-fwtpm --enable-spdm --enable-tcg --enable-psk --enable-debug"
          - name: spdm-no-getenv
            wolftpm_config: "--enable-fwtpm --enable-spdm --enable-tcg --enable-psk CFLAGS=-DNO_GETENV"

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@6c3c2f2c1c457b00c10c4848d6f5491db3b629df
        with:
          egress-policy: audit

      - name: Checkout wolfTPM
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: true
          persist-credentials: false

      - name: Resolve wolfSSL master
        id: wolfssl_rev
        run: |
          set -euo pipefail
          sha=$(git ls-remote https://github.com/wolfSSL/wolfssl.git refs/heads/master | awk 'NR==1 {print $1}')
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Cache wolfSSL build
        id: wolfssl_cache
        uses: actions/cache@v4
        with:
          path: wolfssl
          key: wolfssl-spdm-docker-v1.1-${{ steps.wolfssl_rev.outputs.sha }}

      - name: Build and test SPDM in Docker (${{ matrix.name }})
        env:
          CI_IMAGE: ghcr.io/wolfssl/wolftpm-ci:v1.1
          WOLFSSL_SHA: ${{ steps.wolfssl_rev.outputs.sha }}
          WOLFSSL_CACHE_HIT: ${{ steps.wolfssl_cache.outputs.cache-hit }}
          SPDM_NAME: ${{ matrix.name }}
          SPDM_CONFIG: ${{ matrix.wolftpm_config }}
          SPDM_MODE: build
        run: |
          mkdir -p "$RUNNER_TEMP/spdm-logs"
          docker run --rm --user "$(id -u):$(id -g)" \
            --env WOLFSSL_SHA --env WOLFSSL_CACHE_HIT --env SPDM_NAME \
            --env SPDM_CONFIG --env SPDM_MODE \
            --env GIT_CONFIG_GLOBAL=/tmp/wolftpm-ci.gitconfig \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace" \
            --mount "type=bind,source=$RUNNER_TEMP/spdm-logs,target=/tmp" \
            --workdir /workspace "$CI_IMAGE" bash scripts/ci/spdm.sh

  # End-to-end matrix: same protocol coverage as the old hw-spdm-test, but
  # against fwtpm_server instead of real silicon. fwtpm-tcg covers pinned and
  # rejected initialization, the full unit suite over SPDM, lock/status/caps,
  # unlock, and cleartext recovery. fwtpm-psk mirrors the Nations-PSK flow.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fwtpm-tcg
            mode: fwtpm-tcg
          - name: fwtpm-psk
            mode: fwtpm-psk

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@6c3c2f2c1c457b00c10c4848d6f5491db3b629df
        with:
          egress-policy: audit

      - name: Checkout wolfTPM
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: true
          persist-credentials: false

      - name: Resolve wolfSSL master
        id: wolfssl_rev
        run: |
          set -euo pipefail
          sha=$(git ls-remote https://github.com/wolfSSL/wolfssl.git refs/heads/master | awk 'NR==1 {print $1}')
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Cache wolfSSL build
        id: wolfssl_cache
        uses: actions/cache@v4
        with:
          path: wolfssl
          key: wolfssl-spdm-docker-v1.1-${{ steps.wolfssl_rev.outputs.sha }}

      - name: Build and test SPDM in Docker (${{ matrix.name }})
        env:
          CI_IMAGE: ghcr.io/wolfssl/wolftpm-ci:v1.1
          WOLFSSL_SHA: ${{ steps.wolfssl_rev.outputs.sha }}
          WOLFSSL_CACHE_HIT: ${{ steps.wolfssl_cache.outputs.cache-hit }}
          SPDM_NAME: ${{ matrix.name }}
          SPDM_CONFIG: ''
          SPDM_MODE: ${{ matrix.mode }}
        run: |
          mkdir -p "$RUNNER_TEMP/spdm-logs"
          docker run --rm --user "$(id -u):$(id -g)" \
            --env WOLFSSL_SHA --env WOLFSSL_CACHE_HIT --env SPDM_NAME \
            --env SPDM_CONFIG --env SPDM_MODE \
            --env GIT_CONFIG_GLOBAL=/tmp/wolftpm-ci.gitconfig \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace" \
            --mount "type=bind,source=$RUNNER_TEMP/spdm-logs,target=/tmp" \
            --workdir /workspace "$CI_IMAGE" bash scripts/ci/spdm.sh

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spdm-logs-${{ matrix.name }}
          path: |
            *.log
            config.log
            test-suite.log
            tests/*.log
            ${{ runner.temp }}/spdm-logs/fwtpm_spdm_test.*
          retention-days: 14
